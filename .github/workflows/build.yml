name: CI — Build, Test & Static Analysis

on:
  push:
    branches: [ target-project ]
  pull_request:
    branches: [ target-project ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Compile + Unit Tests
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Unit Tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: target_project

      - name: Fix snapshot dependency (gdx-controllers)
        working-directory: target_project
        run: |
          sed -i "s/2.2.4-SNAPSHOT/2.2.4/g" build.gradle || true

      - name: Compile all modules
        working-directory: target_project
        run: ./gradlew :SPD-classes:compileJava :core:compileJava --no-daemon

      - name: Compile test sources
        working-directory: target_project
        run: ./gradlew :core:compileTestJava --no-daemon

      - name: Run unit tests
        working-directory: target_project
        run: ./gradlew :core:test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-jdk${{ matrix.java }}
          path: target_project/core/build/reports/tests/test/
          retention-days: 14

      - name: Upload test XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk${{ matrix.java }}
          path: target_project/core/build/test-results/test/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: SpotBugs Static Analysis
  # ─────────────────────────────────────────────────────────────────────────
  static-analysis:
    name: SpotBugs Static Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: target_project

      - name: Fix snapshot dependency
        working-directory: target_project
        run: sed -i "s/2.2.4-SNAPSHOT/2.2.4/g" build.gradle || true

      - name: Run SpotBugs on core module
        working-directory: target_project
        run: ./gradlew :core:spotbugsMain --no-daemon
        continue-on-error: true

      - name: Upload SpotBugs HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target_project/core/build/reports/spotbugs/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Desktop build verification
  # ─────────────────────────────────────────────────────────────────────────
  build-desktop:
    name: Desktop Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: target_project

      - name: Fix snapshot dependency
        working-directory: target_project
        run: sed -i "s/2.2.4-SNAPSHOT/2.2.4/g" build.gradle || true

      - name: Build desktop JAR
        working-directory: target_project
        run: ./gradlew :desktop:jar --no-daemon

      - name: Verify JAR was produced
        working-directory: target_project
        run: |
          JAR=$(find desktop/build/libs -name "*.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "ERROR: No desktop JAR found!"
            exit 1
          fi
          echo "Desktop JAR produced: $JAR ($(du -sh $JAR | cut -f1))"

      - name: Upload desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: desktop-jar
          path: target_project/desktop/build/libs/*.jar
          retention-days: 14
